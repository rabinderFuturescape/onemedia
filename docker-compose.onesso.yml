version: '3.8'

services:
  # Static files server for test pages
  postiz-static:
    image: nginx:alpine
    container_name: postiz-static
    restart: always
    volumes:
      - ./var/docker/static:/usr/share/nginx/html
    ports:
      - 5003:80
    networks:
      - postiz-network

  # Mock onesso service
  mock-onesso:
    build:
      context: ./var/docker/mock-onesso
      dockerfile: Dockerfile
    container_name: mock-onesso
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      JWT_SECRET: mock-onesso-jwt-secret
      FRONTEND_URL: http://localhost:5003
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002,http://localhost:4200,http://localhost:5003
    networks:
      - postiz-network

  # Postgres database for the application
  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  # Redis for caching and session storage
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # Frontend application
  postiz-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: postiz-frontend
    restart: always
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - PORT=4200
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4200/api/mock
      - BACKEND_URL=http://localhost:4200/api/mock
      - BACKEND_INTERNAL_URL=http://localhost:4200/api/mock
      - FRONTEND_URL=http://localhost:4200
      - STORAGE_PROVIDER=local
      - IS_GENERAL=true
      - NOT_SECURED=true
      - NEXT_PUBLIC_ONESSO_URL=http://localhost:3002
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./libraries:/app/libraries
    depends_on:
      - mock-onesso
      - postiz-postgres
      - postiz-redis
    networks:
      - postiz-network

  # Backend application
  postiz-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: postiz-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      - REDIS_URL=redis://postiz-redis:6379
      - FRONTEND_URL=http://localhost:4200
      - ONESSO_URL=http://mock-onesso:3002
      - JWT_SECRET=mock-onesso-jwt-secret
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./libraries:/app/libraries
    depends_on:
      - mock-onesso
      - postiz-postgres
      - postiz-redis
    networks:
      - postiz-network

volumes:
  postgres-volume:
  postiz-redis-data:

networks:
  postiz-network:
    driver: bridge
