version: '3.8'

services:
  # Keycloak database
  keycloak-postgres:
    image: postgres:14-alpine
    container_name: keycloak-postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - onesso-network
    healthcheck:
      test: pg_isready -U keycloak -d keycloak
      interval: 10s
      timeout: 3s
      retries: 3

  # Keycloak service
  keycloak:
    image: keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_PROXY: edge
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - onesso-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Mock onesso service
  mock-onesso:
    build:
      context: ./var/docker/mock-onesso
      dockerfile: Dockerfile.final
    container_name: mock-onesso
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      JWT_SECRET: mock-onesso-jwt-secret
      FRONTEND_URL: http://localhost:4200
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002,http://localhost:4200,http://localhost:5003
    networks:
      - onesso-network
    # No dependencies for mock-onesso
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application database
  postiz-postgres:
    image: postgres:14-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    ports:
      - "5433:5432"
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - onesso-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  # Redis for caching
  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - postiz-redis-data:/data
    networks:
      - onesso-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3

  # Frontend application
  postiz-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.simple.fixed7
    container_name: postiz-frontend
    restart: always
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - PORT=4200
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000/api
      - BACKEND_URL=http://postiz-backend:3000/api
      - BACKEND_INTERNAL_URL=http://postiz-backend:3000/api
      - FRONTEND_URL=http://localhost:4200
      - NEXT_PUBLIC_ONESSO_URL=http://localhost:3002
      - NEXTAUTH_URL=http://localhost:4200
      - NEXTAUTH_SECRET=onesso-nextauth-secret
      - npm_config_python=/usr/bin/python3
      - npm_config_node_gyp=/usr/local/bin/node-gyp
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./libraries:/app/libraries
      - node_modules:/app/node_modules
      - ./.npmrc:/app/.npmrc
    depends_on:
      mock-onesso:
        condition: service_started
      postiz-backend:
        condition: service_started
    networks:
      - onesso-network

  # Backend application
  postiz-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.simple.fixed
    container_name: postiz-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      - REDIS_URL=redis://postiz-redis:6379
      - FRONTEND_URL=http://localhost:4200
      - ONESSO_URL=http://mock-onesso:3002
      - JWT_SECRET=mock-onesso-jwt-secret
      - npm_config_python=/usr/bin/python3
      - npm_config_node_gyp=/usr/local/bin/node-gyp
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./libraries:/app/libraries
      - node_modules:/app/node_modules
      - postiz-uploads:/app/uploads
      - ./.npmrc:/app/.npmrc
    depends_on:
      mock-onesso:
        condition: service_started
      postiz-postgres:
        condition: service_started
      postiz-redis:
        condition: service_started
    networks:
      - onesso-network

volumes:
  keycloak-postgres-data:
  postiz-postgres-data:
  postiz-redis-data:
  postiz-uploads:
  node_modules:

networks:
  onesso-network:
    driver: bridge
