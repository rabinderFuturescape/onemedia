global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    metrics_path: /api/metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['auth-service:3001']
    basic_auth:
      username: prometheus
      password: ${METRICS_API_KEY}

  - job_name: 'backend'
    metrics_path: /api/metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:3000']
    basic_auth:
      username: prometheus
      password: ${METRICS_API_KEY}

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
