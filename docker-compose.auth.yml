version: '3.8'

services:
  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./apps/auth-service/.env
    depends_on:
      - postgres
    networks:
      - gitroom-network

  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gitroom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gitroom-network

networks:
  gitroom-network:
    driver: bridge

volumes:
  postgres-data:
