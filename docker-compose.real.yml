version: '3.8'

services:
  # Static files server for test pages
  postiz-static:
    image: nginx:alpine
    container_name: postiz-static
    restart: always
    volumes:
      - ./var/docker/static:/usr/share/nginx/html
    ports:
      - 5003:80
    networks:
      - postiz-network

  # Keycloak database
  keycloak-postgres:
    image: postgres:14
    container_name: keycloak-postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak authentication server
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - postiz-network

  # onesso authentication service
  onesso:
    build:
      context: .
      dockerfile: apps/onesso/Dockerfile
    container_name: onesso
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      JWT_SECRET: onesso-jwt-secret
      FRONTEND_URL: http://localhost:4200
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002,http://localhost:4200,http://localhost:5003
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENT_ID: admin-cli
      KEYCLOAK_CLIENT_SECRET: 
      KEYCLOAK_PUBLIC_CLIENT_ID: account
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      OIDC_CONFIG_CACHE_TTL: 3600
    depends_on:
      - keycloak
    networks:
      - postiz-network

  # Postgres database for the application
  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  # Redis for caching and session storage
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # Backend application
  postiz-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: postiz-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      - REDIS_URL=redis://postiz-redis:6379
      - FRONTEND_URL=http://localhost:4200
      - ONESSO_URL=http://onesso:3002
      - JWT_SECRET=onesso-jwt-secret
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./libraries:/app/libraries
    depends_on:
      - onesso
      - postiz-postgres
      - postiz-redis
    networks:
      - postiz-network

  # Frontend application
  postiz-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: postiz-frontend
    restart: always
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - PORT=4200
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000/api
      - BACKEND_URL=http://postiz-backend:3000/api
      - BACKEND_INTERNAL_URL=http://postiz-backend:3000/api
      - FRONTEND_URL=http://localhost:4200
      - STORAGE_PROVIDER=local
      - IS_GENERAL=true
      - NOT_SECURED=true
      - NEXT_PUBLIC_ONESSO_URL=http://localhost:3002
      - NEXTAUTH_URL=http://localhost:4200
      - NEXTAUTH_SECRET=onesso-nextauth-secret
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./libraries:/app/libraries
    depends_on:
      - onesso
      - postiz-backend
    networks:
      - postiz-network

volumes:
  postgres-volume:
  postiz-redis-data:
  keycloak-postgres-data:

networks:
  postiz-network:
    driver: bridge
