version: '3.8'

services:
  # Frontend service
  postiz-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:sha-${GITHUB_SHA}
    container_name: postiz-frontend
    restart: always
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000/api
      - BACKEND_URL=http://postiz-backend:3000/api
      - BACKEND_INTERNAL_URL=http://postiz-backend:3000/api
      - FRONTEND_URL=http://localhost:4200
      - NEXT_PUBLIC_ONESSO_URL=http://localhost:3002
      - NEXTAUTH_URL=http://localhost:4200
      - NEXTAUTH_SECRET=test-nextauth-secret
    depends_on:
      - postiz-backend
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4200/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Backend service
  postiz-backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:sha-${GITHUB_SHA}
    container_name: postiz-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-test
      - REDIS_URL=redis://postiz-redis:6379
      - FRONTEND_URL=http://localhost:4200
      - ONESSO_URL=http://mock-onesso:3002
      - JWT_SECRET=test-jwt-secret
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Mock onesso service
  mock-onesso:
    build:
      context: ./var/docker/mock-onesso
      dockerfile: Dockerfile
    container_name: mock-onesso
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      JWT_SECRET: test-jwt-secret
      FRONTEND_URL: http://localhost:4200
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002,http://localhost:4200
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL database
  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-test
    ports:
      - "5432:5432"
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-test
      interval: 5s
      timeout: 3s
      retries: 3

  # Redis cache
  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - postiz-network

networks:
  postiz-network:
    driver: bridge
